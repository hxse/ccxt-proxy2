[project]
name = "ccxt-proxy2"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "ccxt",
    "pydantic",
    "filelock",
    "jinja2",
    "scalar-fastapi",
    "python-multipart",
    "numpy",
    "tzdata",
    "fastapi-login",
    "loguru",
    "tqsdk",
    "httpx",
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
]

[project.optional-dependencies]
ctp = ["vnpy_ctp==6.7.11.4+ccxtproxy.2"]

[tool.uv]
exclude-dependencies = ["vnpy"]

[tool.uv.sources]
vnpy_ctp = { path = "vendor/vnpy_ctp/vnpy_ctp-6.7.11.4+ccxtproxy.2.tar.gz" }


[dependency-groups]
dev = [
    "pytest",
    "pybind11>=3.0.1",
    "python-dotenv>=1.2,<2",
    "tomli-w>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["Test"]
addopts = "--ignore=Test/online"
markers = [
    "online: opt-in tests that access external services",
    "stateful: opt-in tests that mutate sandbox or external state",
]
