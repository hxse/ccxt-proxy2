[project]
name = "ccxt-proxy2"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "ccxt",
    "pydantic",
    "filelock",
    "jinja2",
    "scalar-fastapi",
    "python-multipart",
    "numpy",
    "tzdata",
    "fastapi-login",
    "loguru",
    "tqsdk",
    "httpx",
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
]


[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["Test"]
addopts = "--ignore=Test/online"
markers = [
    "online: opt-in tests that access external services",
    "stateful: opt-in tests that mutate sandbox or external state",
]
