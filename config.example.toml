# 复制为项目根目录 config.toml，填写实际配置后重启服务。
# config.toml 不提交 Git、不进入镜像构建上下文，通过运行时挂载提供。
# 字符串用引号包裹；密码里的 $ / ${...} 原样保留，不展开环境变量。
# TOML 没有 null：未配置的可选字段/分组直接省略或保持注释。

# JWT 签名密钥，替换为自己生成的随机值；根字段需写在分组之前。
SECRET = "replace-with-a-random-secret"

# 本服务的登录用户，供 /auth/token 和 Bruno 使用。
[users.admin]
password = "replace-with-your-password"

# 多个用户分别增加分组；用户名含点时用引号，例如 [users."alice.dev"]。
# [users.alice]
# password = "replace-with-another-password"

# 可选代理；Binance、Kraken、TQ 共用地址，各自默认关闭。
# 远端默认上传只在副本中开启三个服务的开关，本地原件不变。
# [proxy]
# http = "http://127.0.0.1:7890"

# Binance；test 对应 sandbox，live 对应实盘。
# [binance]
# enable_proxy = false
# [binance.test]
# api_key = ""
# secret = ""
# [binance.live]
# api_key = ""
# secret = ""

# Kraken。
# [kraken]
# enable_proxy = false
# [kraken.test]
# api_key = ""
# secret = ""
# [kraken.live]
# api_key = ""
# secret = ""

# TQ 行情。
# [tq]
# enable_proxy = false
# username = ""
# password = ""

# CTP 模拟盘（SimNow 等）；按实际环境填写整组后取消注释。
# [ctp.test]
# trader_front = "tcp://simnow-trade-front.example:12345"
# broker_id = "9999"
# investor_id = ""
# password = ""
# app_id = ""
# auth_code = ""
# production_mode = true
# user_id 可省略，默认使用 investor_id；如需指定，填写非空字符串。

# CTP 实盘；与模拟盘使用独立账户信息。
# [ctp.live]
# trader_front = "tcp://broker-trade-front.example:12345"
# broker_id = ""
# investor_id = ""
# password = ""
# app_id = ""
# auth_code = ""
# production_mode = true

# 可选连接设置；test/live 分别使用 flow_path 下的 sandbox/live 子目录。
# [ctp]
# flow_path = "./data/ctp"
# connect_timeout_seconds = 10
# request_timeout_seconds = 10
# query_interval_seconds = 1.1

# CFB HTTP 薄转发；账户在独立 CFB 项目配置，sandbox/live 参数原样转发。
# [cfb]
# base_url = "http://127.0.0.1:45173"
# request_timeout_seconds = 300

# Telegram：每个 chat alias 单独一行，chat_id 保持字符串。
# [telegram]
# bot_token = ""
# [telegram.chats]
# scanner = "-100123456"
# ops = "-100654321"

# 本地 OHLCV 缓存，省略时使用相同默认值。
[ohlcv_cache]
database_path = "./data/cache/ohlcv.duckdb"
max_rows_per_series = 2000000
max_rows_total = 20000000

# 统一服务白名单：只有这里列出的实例会在启动时初始化。
# 账号配置本身不会启用服务；缺省为空白名单，不加载 CCXT/TQ/CTP/CFB。
# 配置只在进程启动时读取，运行中修改无效；重启后生效。
# 某个 SDK 初始化失败只影响该身份，其他服务继续运行。
# 每个 CCXT 身份必须明确 exchange/market/mode，不允许重复。
# [[service_whitelist]]
# service = "ccxt"
# exchange = "binance"
# market = "future"
# mode = "sandbox"

# [[service_whitelist]]
# service = "ccxt"
# exchange = "kraken"
# market = "future"
# mode = "live"

# TQ 使用 [tq] 账号，不接受 exchange/market/mode。
# [[service_whitelist]]
# service = "tq"

# CTP 每个模式独立启用；sandbox 使用 [ctp.test]，live 使用 [ctp.live]。
# [[service_whitelist]]
# service = "ctp"
# mode = "sandbox"

# [[service_whitelist]]
# service = "ctp"
# mode = "live"

# CFB 启动时创建 HTTP 客户端；不触发上游登录，不按 mode 限制转发。
# [[service_whitelist]]
# service = "cfb"

# 文件：现有私有 config.toml；以下只是新增片段，不是完整文件。
[market_data_client]
# 后台脚本实际访问的本项目服务地址；容器内运行时按容器监听端口填写。
base_url = "http://127.0.0.1:5123"
# 引用已有 [users.admin] 的 HTTP 登录账号；示例名须换成本地实际配置的键。
user = "admin"
# 后台单次 HTTP 请求的等待上限，单位秒；不覆盖路由或 SDK 自身超时。
request_timeout_seconds = 60

# 可选远程部署目标；仅 just deploy 使用，不影响路由和后台采集计划。
# [deployment]
# SSH 主机别名，沿用 ssh rn 的用户、端口和密钥；不填写整条 shell 命令。
# ssh_host = "rn"
# 相对于 SSH 登录用户主目录；支持空格，不接受绝对路径和 ..。
# remote_dir = "dev/ccxt-proxy2"
