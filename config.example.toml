# 复制为项目根目录 config.toml，填写实际配置后重启服务。
# config.toml 不提交 Git、不进入镜像构建上下文，通过运行时挂载提供。
# 字符串用引号包裹；密码里的 $ / ${...} 原样保留，不展开环境变量。
# TOML 没有 null：未配置的可选字段/分组直接省略或保持注释。

# JWT 签名密钥，替换为自己生成的随机值；根字段需写在分组之前。
SECRET = "replace-with-a-random-secret"

# 公共服务白名单，供 dev/local 使用；填写账户本身不会启用服务。
# service 指定服务；CCXT 还需 exchange（交易所）与 market（市场）。
# is_live 必填布尔值：true=实盘，false=模拟盘；TQ 不接受该字段。
# 同一身份不能重复；配置只在启动时读取。
service_whitelist = [
    # 其他服务按需取消注释，并填写对应账户分组。
    # { service = "ccxt", exchange = "binance", market = "future", is_live = false },
    # { service = "ccxt", exchange = "binance", market = "future", is_live = true },
    # { service = "ccxt", exchange = "kraken", market = "future", is_live = false },
    # { service = "ccxt", exchange = "kraken", market = "future", is_live = true },
    # { service = "tq" },
    # { service = "ctp", is_live = false },
    # { service = "ctp", is_live = true },
    { service = "cfb", is_live = false },
    { service = "cfb", is_live = true },
]

# 本服务的登录用户，供 /auth/token 和 Bruno 使用。
[users.admin]
password = "replace-with-your-password"

# 多个用户分别增加分组；用户名含点时用引号，例如 [users."alice.dev"]。
# [users.alice]
# password = "replace-with-another-password"

# 可选代理；Binance、Kraken、TQ 共用地址，各自默认关闭。
# 远端原样上传此文件，程序通过 overrides.remote 在内存中开启代理。
# [proxy]
# http = "http://127.0.0.1:7890"

# Binance；test 对应 sandbox，live 对应实盘；代理开关也用于 live 公共取时。
# [binance]
# enable_proxy = false
# [binance.test]
# api_key = ""
# secret = ""
# [binance.live]
# api_key = ""
# secret = ""

# Kraken。
# [kraken]
# enable_proxy = false
# [kraken.test]
# api_key = ""
# secret = ""
# [kraken.live]
# api_key = ""
# secret = ""

# TQ 行情。
# [tq]
# enable_proxy = false
# username = ""
# password = ""

# CTP 模拟盘（SimNow 等）；按实际环境填写整组后取消注释。
# [ctp.test]
# trader_front = "tcp://simnow-trade-front.example:12345"
# broker_id = "9999"
# investor_id = ""
# password = ""
# app_id = ""
# auth_code = ""
# production_mode = true
# user_id 可省略，默认使用 investor_id；如需指定，填写非空字符串。

# CTP 实盘；与模拟盘使用独立账户信息。
# [ctp.live]
# trader_front = "tcp://broker-trade-front.example:12345"
# broker_id = ""
# investor_id = ""
# password = ""
# app_id = ""
# auth_code = ""
# production_mode = true

# 可选连接设置；test/live 分别使用 flow_path 下的 sandbox/live 子目录。
# [ctp]
# flow_path = "./data/ctp"
# connect_timeout_seconds = 10
# request_timeout_seconds = 10
# query_interval_seconds = 1.1

# Telegram：每个 chat alias 单独一行，chat_id 保持字符串。
# [telegram]
# bot_token = ""
# [telegram.chats]
# scanner = "-100123456"
# ops = "-100654321"

# 本地 OHLCV 缓存，省略时使用相同默认值。
[ohlcv_cache]
database_path = "./data/cache/ohlcv.duckdb"
max_rows_per_series = 2000000
max_rows_total = 20000000

[market_data_client]
# 后台脚本实际访问的本项目服务地址；容器内运行时按容器监听端口填写。
base_url = "http://127.0.0.1:5123"
# 引用已有 [users.admin] 的 HTTP 登录账号；示例名须换成本地实际配置的键。
user = "admin"
# 后台单次 HTTP 请求的等待上限，单位秒；不覆盖路由或 SDK 自身超时。
request_timeout_seconds = 60

# 可选远程部署目标；仅 just deploy 使用，不影响路由和后台采集计划。
# [deployment]
# SSH 主机别名，沿用 ssh rn 的用户、端口和密钥；不填写整条 shell 命令。
# ssh_host = "rn"
# 相对于 SSH 登录用户主目录；支持空格，不接受绝对路径和 ..。
# remote_dir = "dev/ccxt-proxy2"

# 按运行场景覆盖；公共配置用于 dev/local，远端由加载器合并，不改原文件。
# 四个服务在远端使用上方同一 [proxy] 地址。
[overrides.remote]
# 远端完整白名单，整体替换公共数组；CCXT、CFB 只保留实盘。
# 需要在远端运行的其他服务也须明确列出，不自动与公共数组合并。
service_whitelist = [
    # 与上方账户配置配套启用；远端这里同样需要列出。
    # { service = "ccxt", exchange = "binance", market = "future", is_live = true },
    # { service = "ccxt", exchange = "kraken", market = "future", is_live = true },
    # { service = "tq" },
    # { service = "ctp", is_live = true },
    { service = "cfb", is_live = true },
]

[overrides.remote.binance]
enable_proxy = true
[overrides.remote.kraken]
enable_proxy = true
[overrides.remote.tq]
enable_proxy = true

# CFB 与主服务通过项目数据目录的 Unix socket 通信。
[cfb]
# 本地直连；远端由 overrides.remote.cfb 开启公共 HTTP CONNECT 代理。
enable_proxy = false
# 启用 VNC/noVNC，仅发布宿主回环端口。
vnc_enabled = true
# 等待执行器的秒数；超时不表示已开始的交易取消。
request_timeout_seconds = 300.0

[cfb.bridge]
# 执行容器内固定目录；宿主对应本项目 data/cfb/<mode>。
data_dir = "/data"
# 终端和登录启动预算，单位秒。
startup_timeout_seconds = 90

[cfb.desktop]
# 虚拟桌面宽度，单位像素。
width = 1280
# 虚拟桌面高度，单位像素。
height = 800
# 虚拟桌面 DPI。
dpi = 96

[cfb.vnc.sandbox]
# VNC 端口，仅发布 127.0.0.1。
port = 45174
# noVNC 网页端口，仅发布 127.0.0.1。
web_port = 45175

[cfb.execution]
# 唯一业务队列容量。
queue_capacity = 32
# 未执行排队等待上限，毫秒。
queue_timeout_ms = 5000
# 单个 GUI 步骤期限，毫秒。
step_timeout_ms = 3000
# 等待状态变化时的轮询间隔，毫秒。
poll_interval_ms = 10
# GUI 动作之间的最小间隔，毫秒。
gui_action_gap_ms = 10
# CSV 核对的最多轮数。
csv_confirmation_attempts = 3
# CSV 核对轮次间隔，毫秒。
csv_confirmation_interval_ms = 100
# 限价允许截断的最大超界比例；0 关闭截断。
price_max_deviation_ratio = 0.05
# 正常已结束幂等记录的保护小时数；unknown 不自动过期。
idempotency_ttl_hours = 168
# 防重发数据库及 WAL 的字节预算。
journal_max_bytes = 134217728

[cfb.reconnect]
# 启用已核验连接故障的自动恢复。
enabled = true
# 每次连接失败后等待的秒数。
interval_seconds = 600

[cfb.logging]
# CFB 执行器日志级别。
level = "INFO"
# 单个日志文件字节预算。
max_file_bytes = 20971520
# 该类存储的总字节预算。
max_total_bytes = 209715200

[cfb.artifacts]
# 该类存储的总字节预算。
max_total_bytes = 314572800
# 文件治理检查间隔，秒。
cleanup_interval_seconds = 60
# 允许新工件前必须保留的磁盘字节数。
min_free_bytes = 536870912

[cfb.accounts.sandbox]
# 受支持的原生券商编号。
broker_id = "9999"
# 明确选择原生站点，不自动切换。
site = "电信2"
# 账户名；仅保存在私有配置。
username = ""
# 账户密码；与 username 一起填写。
password = ""

[cfb.accounts.live]
# 受支持的原生券商编号。
broker_id = "6020"
# 明确选择原生站点，不自动切换。
site = "一套"
# 账户名；仅保存在私有配置。
username = ""
# 账户密码；与 username 一起填写。
password = ""

[overrides.remote.cfb]
# 远端 CFB 使用公共 HTTP CONNECT 代理，本地默认关闭。
enable_proxy = true

[cfb.vnc.live]
# 实盘 VNC 端口，仅发布 127.0.0.1，不与模拟盘冲突。
port = 45176
# 实盘 noVNC 端口，仅发布 127.0.0.1。
web_port = 45177
